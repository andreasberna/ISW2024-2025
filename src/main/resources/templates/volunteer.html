<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volontario - Tour Guide Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .section-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        .alert-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            display: none;
            min-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Tour Guide Planner - Area Volontario</a>
            <button id="logoutButton" class="btn btn-outline-light">Logout</button>
        </div>
    </nav>

    <div id="successAlert" class="alert alert-success alert-dismissible fade show alert-fixed" role="alert">
        <span id="successMessage">Operazione completata con successo!</span>
        <button type="button" class="btn-close" onclick="hideAlert('successAlert')" aria-label="Close"></button>
    </div>
    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show alert-fixed" role="alert">
        <span id="errorMessage">Si è verificato un errore.</span>
        <button type="button" class="btn-close" onclick="hideAlert('errorAlert')" aria-label="Close"></button>
    </div>

    <div class="container mt-4">
        <div class="section-container">
            <h2 class="h4 mb-4 text-primary border-bottom pb-2">Invia la tua Disponibilità</h2>
            <form id="availabilityForm">
                <div class="mb-3">
                    <label for="availabilityMonth" class="form-label">Mese e Anno</label>
                    <input type="month" class="form-control" id="availabilityMonth" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Giorni Preferiti</label>
                    <div>
                        <input type="checkbox" class="form-check-input" id="day-MONDAY" value="MONDAY">
                        <label for="day-MONDAY" class="form-check-label">Lunedì</label>
                    </div>
                    <!-- Add other days similarly -->
                </div>
                <button type="submit" class="btn btn-primary">Invia Disponibilità</button>
            </form>
        </div>

        <div class="section-container">
            <h2 class="h4 mb-4 text-primary border-bottom pb-2">I Miei Turni Assegnati</h2>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle" id="assignedVisitsTable">
                    <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th>Orario</th>
                            <th>Titolo Visita</th>
                            <th>Luogo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- I turni verranno caricati qui via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = '/api/volunteers';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('availabilityForm').addEventListener('submit', handleAvailabilitySubmit);
            loadAssignedVisits();
            document.getElementById('logoutButton').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '/index.html';
            });
        });

        function showAlert(type, message) {
            const alertId = type === 'success' ? 'successAlert' : 'errorAlert';
            const msgId = type === 'success' ? 'successMessage' : 'errorMessage';
            document.getElementById(msgId).textContent = message;
            const alertEl = document.getElementById(alertId);
            alertEl.style.display = 'block';
            if (type === 'success') {
                setTimeout(() => hideAlert(alertId), 3000);
            }
        }

        function hideAlert(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function handleResponse(response) {
            if (!response.ok) {
                let errorMsg;
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.message || errorData.error || `Errore ${response.status}`;
                } catch (e) {
                    errorMsg = `Errore ${response.status}: ${response.statusText}`;
                }
                throw new Error(errorMsg);
            }
            if (response.status === 204) return null;
            const text = await response.text();
            try {
                return text ? JSON.parse(text) : null;
            } catch (e) {
                return text;
            }
        }

        async function handleAvailabilitySubmit(event) {
            event.preventDefault();
            const username = localStorage.getItem('username');
            const month = document.getElementById('availabilityMonth').value;
            const preferredDays = Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);

            try {
                const response = await fetch(`${API_BASE}/${username}/availability`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ month, preferredDays })
                });
                await handleResponse(response);
                showAlert('success', 'Disponibilità inviata con successo!');
            } catch (error) {
                showAlert('error', 'Errore durante l\'invio della disponibilità: ' + error.message);
            }
        }

        async function loadAssignedVisits() {
            try {
                const response = await fetch(`${API_BASE}/assigned-visits`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                const visits = await handleResponse(response);
                const tbody = document.querySelector('#assignedVisitsTable tbody');
                tbody.innerHTML = '';
                if (visits.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">Nessun turno assegnato al momento.</td></tr>';
                    return;
                }
                visits.forEach(visit => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${visit.date}</td>
                        <td>${visit.startTime}</td>
                        <td>${visit.visitTitle}</td>
                        <td>${visit.location}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showAlert('error', 'Impossibile caricare i turni assegnati: ' + error.message);
            }
        }
    </script>
</body>
</html>
