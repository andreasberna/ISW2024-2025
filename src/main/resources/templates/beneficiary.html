<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficiario - Tour Guide Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .section-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        .alert-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            display: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Tour Guide Planner</a>
            <button id="logoutButton" class="btn btn-outline-light">Logout</button>
        </div>
    </nav>

    <div id="successAlert" class="alert alert-success alert-dismissible fade show alert-fixed" role="alert"></div>
    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show alert-fixed" role="alert"></div>

    <div class="container mt-4">
        <div class="section-container">
            <h2 class="h4 mb-4 text-primary border-bottom pb-2">Visite Disponibili</h2>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle" id="availableVisitsTable">
                    <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th>Orario</th>
                            <th>Titolo Visita</th>
                            <th>Luogo</th>
                            <th class="text-center">Azione</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="section-container">
            <h2 class="h4 mb-4 text-primary border-bottom pb-2">Le Mie Prenotazioni</h2>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle" id="myBookingsTable">
                    <thead class="table-light">
                        <tr>
                            <th>Codice</th>
                            <th>Data</th>
                            <th>Titolo Visita</th>
                            <th>Partecipanti</th>
                            <th>Stato</th>
                            <th class="text-center">Azione</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = '/api/beneficiaries';
        const authToken = localStorage.getItem('authToken');

        document.addEventListener('DOMContentLoaded', () => {
            if (!authToken) {
                window.location.href = '/login.html';
                return;
            }
            loadAvailableVisits();
            loadMyBookings();
            document.getElementById('logoutButton').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '/index.html';
            });
        });

        function showAlert(type, message) {
            const alertEl = document.getElementById(type === 'success' ? 'successAlert' : 'errorAlert');
            alertEl.textContent = message;
            alertEl.style.display = 'block';
            setTimeout(() => alertEl.style.display = 'none', 3000);
        }

        async function handleResponse(response) {
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ message: response.statusText }));
                throw new Error(errorData.message || `Errore ${response.status}`);
            }
            return response.status === 204 ? null : response.json();
        }

        async function loadAvailableVisits() {
            try {
                const visits = await handleResponse(await fetch(`${API_BASE}/available-visits`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }));
                const tbody = document.querySelector('#availableVisitsTable tbody');
                tbody.innerHTML = '';
                visits.forEach(visit => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${visit.date}</td>
                        <td>${visit.startTime}</td>
                        <td>${visit.title}</td>
                        <td>${visit.location}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-primary" onclick="bookVisit('${visit.id}')">Prenota</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showAlert('error', 'Impossibile caricare le visite disponibili: ' + error.message);
            }
        }

        async function bookVisit(visitId) {
            const participants = prompt("Numero di partecipanti:", "1");
            if (!participants || isNaN(participants) || participants < 1) {
                showAlert('error', 'Numero di partecipanti non valido.');
                return;
            }
            try {
                const bookingCode = await handleResponse(await fetch(`${API_BASE}/book-visit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ visitId, participants })
                }));
                showAlert('success', `Prenotazione effettuata con successo! Codice: ${bookingCode}`);
                loadMyBookings();
            } catch (error) {
                showAlert('error', 'Errore durante la prenotazione: ' + error.message);
            }
        }

        async function loadMyBookings() {
            try {
                const bookings = await handleResponse(await fetch(`${API_BASE}/my-bookings`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }));
                const tbody = document.querySelector('#myBookingsTable tbody');
                tbody.innerHTML = '';
                bookings.forEach(booking => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${booking.code}</td>
                        <td>${booking.visitDate}</td>
                        <td>${booking.visitTitle}</td>
                        <td>${booking.participants}</td>
                        <td>${booking.status}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-danger" onclick="cancelBooking('${booking.code}')" ${booking.status !== 'CONFIRMED' ? 'disabled' : ''}>Cancella</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showAlert('error', 'Impossibile caricare le mie prenotazioni: ' + error.message);
            }
        }

        async function cancelBooking(bookingCode) {
            if (!confirm('Sei sicuro di voler cancellare questa prenotazione?')) return;
            try {
                await handleResponse(await fetch(`${API_BASE}/bookings/${bookingCode}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }));
                showAlert('success', 'Prenotazione cancellata con successo!');
                loadMyBookings();
                loadAvailableVisits(); // Refresh available visits in case spots opened up
            } catch (error) {
                showAlert('error', 'Errore durante la cancellazione: ' + error.message);
            }
        }
    </script>
</body>
</html>
