<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Beneficiario - Tour Guide Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mt-5 mb-4 fw-semibold text-dark">Tour Guide Planner - Registrazione</h1>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4">
                <h4 class="text-center mb-4">Crea il tuo account</h4>

                <div id="successAlert" class="alert alert-success d-none" role="alert">
                    Registrazione completata! <a href="/index.html">Accedi ora</a>
                </div>
                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Conferma Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="submitBtn">Registrati</button>
                </form>

                <div class="mt-3 text-center">
                    <small>Hai già un account? <a href="/index.html">Accedi</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errorEl = document.getElementById('errorAlert');
        const successEl = document.getElementById('successAlert');
        errorEl.classList.add('d-none');
        successEl.classList.add('d-none');

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            errorEl.textContent = 'Le password non coincidono.';
            errorEl.classList.remove('d-none');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Registrazione...';

        try {
            const response = await fetch('/api/beneficiaries/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, username, password })
            });

            if (response.ok) {
                successEl.classList.remove('d-none');
                document.getElementById('registerForm').reset();
            } else {
                const err = await response.json().catch(() => ({}));
                errorEl.textContent = err.message || 'Errore durante la registrazione. Username già in uso?';
                errorEl.classList.remove('d-none');
            }
        } catch (err) {
            errorEl.textContent = 'Errore di connessione al server.';
            errorEl.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Registrati';
        }
    });
</script>
</body>
</html>
