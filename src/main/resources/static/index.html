<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Guide Planner - Portale di Accesso</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header-title {
            margin-top: 50px;
            margin-bottom: 30px;
            font-weight: 600;
            color: #343a40;
        }
        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center header-title">Tour Guide Planner - Portale di Accesso</h1>

    <!-- Tabs Navs -->
    <ul class="nav nav-tabs justify-content-center" id="loginTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="configurator-tab" data-bs-toggle="tab" data-bs-target="#configurator" type="button" role="tab" aria-controls="configurator" aria-selected="true">Configuratore</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="volunteer-tab" data-bs-toggle="tab" data-bs-target="#volunteer" type="button" role="tab" aria-controls="volunteer" aria-selected="false">Volontario</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="beneficiary-tab" data-bs-toggle="tab" data-bs-target="#beneficiary" type="button" role="tab" aria-controls="beneficiary" aria-selected="false">Beneficiario</button>
        </li>
    </ul>

    <!-- Tabs Content -->
    <div class="tab-content mt-4" id="loginTabsContent">

        <!-- Tab Configuratore -->
        <div class="tab-pane fade show active" id="configurator" role="tabpanel" aria-labelledby="configurator-tab">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4">
                        <h4 class="text-center mb-4">Accesso Configuratore</h4>
                        <form id="configuratorForm">
                            <div class="mb-3">
                                <label for="confNickname" class="form-label">Username</label>
                                <input type="text" class="form-control" id="confNickname" required>
                            </div>
                            <div class="mb-3">
                                <label for="confPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="confPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                            <div id="confError" class="alert alert-danger mt-3 d-none" role="alert">
                                Credenziali errate. Riprova.
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Volontario -->
        <div class="tab-pane fade" id="volunteer" role="tabpanel" aria-labelledby="volunteer-tab">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4">
                        <h4 class="text-center mb-4">Accesso Volontario</h4>
                        <form id="volunteerForm">
                            <div class="mb-3">
                                <label for="volNickname" class="form-label">Username</label>
                                <input type="text" class="form-control" id="volNickname" required>
                            </div>
                            <div class="mb-3">
                                <label for="volPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="volPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                            <div id="volError" class="alert alert-danger mt-3 d-none" role="alert">
                                Credenziali errate. Riprova.
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Beneficiario -->
        <div class="tab-pane fade" id="beneficiary" role="tabpanel" aria-labelledby="beneficiary-tab">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card p-4">
                        <h4 class="text-center mb-4">Accesso Beneficiario</h4>
                        <form id="beneficiaryForm">
                            <div class="mb-3">
                                <label for="benUsername" class="form-label">Username (Email)</label>
                                <input type="text" class="form-control" id="benUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="benPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="benPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Accedi</button>
                            <div id="benError" class="alert alert-danger mt-3 d-none" role="alert">
                                Credenziali errate. Riprova.
                            </div>
                            <div class="mt-3 text-center">
                                <small>Non hai un account? <a href="/register.html">Registrati qui</a></small>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function handleLogin(e, endpoint, payload, errorElementId, successRole, redirectUrl, usernameField) {
        e.preventDefault();
        const errorElement = document.getElementById(errorElementId);
        errorElement.classList.add('d-none'); // Hide error initially

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const result = await response.json();
                const success = result === true || result.success === true;
                if (success) {
                    localStorage.setItem('userRole', successRole);
                    localStorage.setItem('username', payload[usernameField]);
                    localStorage.setItem('password', payload.password);
                    localStorage.setItem('mustChangePassword', result.mustChangePassword ? 'true' : 'false');
                    window.location.href = redirectUrl;
                } else {
                    errorElement.textContent = 'Credenziali errate.';
                    errorElement.classList.remove('d-none');
                }
            } else if (response.status === 401) {
                errorElement.textContent = 'Credenziali errate.';
                errorElement.classList.remove('d-none');
            } else {
                let errorMessage = 'Errore del server. Riprova più tardi.';
                try {
                    const errorObj = await response.json();
                    if (errorObj && errorObj.message) {
                        errorMessage = errorObj.message;
                    }
                } catch (jsonError) {
                    // fall back to default
                }
                errorElement.textContent = errorMessage;
                errorElement.classList.remove('d-none');
            }
        } catch (error) {
            console.error("Login error:", error);
            errorElement.textContent = 'Errore di connessione. Controlla la rete.';
            errorElement.classList.remove('d-none');
        }
    }

    document.getElementById('configuratorForm').addEventListener('submit', function(e) {
        const payload = {
            nickname: document.getElementById('confNickname').value,
            password: document.getElementById('confPassword').value
        };
        handleLogin(e, '/api/configurator/login', payload, 'confError', 'CONFIGURATOR', '/configurator.html', 'nickname');
    });

    document.getElementById('volunteerForm').addEventListener('submit', function(e) {
        const payload = {
            nickname: document.getElementById('volNickname').value,
            password: document.getElementById('volPassword').value
        };
        handleLogin(e, '/api/volunteers/login', payload, 'volError', 'VOLUNTEER', '/volunteer.html', 'nickname');
    });

    document.getElementById('beneficiaryForm').addEventListener('submit', function(e) {
        const payload = {
            username: document.getElementById('benUsername').value,
            password: document.getElementById('benPassword').value
        };
        handleLogin(e, '/api/beneficiaries/login', payload, 'benError', 'BENEFICIARY', '/beneficiary.html', 'username');
    });
</script>

</body>
</html>
